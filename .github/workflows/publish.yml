# Builds Danil (the desktop app) for macOS (Apple Silicon), Windows and/or Linux
# from this repository, signs the requested platform(s) and stages them as a
# prerelease (`v<version>`) on GitHub Releases.
#
# **Who can run it.** Only a tag push (`v*`) or a manual `workflow_dispatch`,
# and both require write access to this repository. It never runs for pull
# requests, so a fork's code never sees the signing secrets. Forks that copy
# this file skip every job (`github.repository` check) instead of failing on
# missing secrets.
#
# ## El contrato por sistema operativo (`updater-stable`)
#
#   • **Cada release versionada (`v<versión>`) es inmutable y nace en staging**
#     (`--prerelease --latest=false`). Puedes construir los tres SO (`platforms=all`)
#     o uno solo (`platforms=macos`, `windows`, `linux`). Si `v<versión>` ya existe
#     como prerelease de otro SO, este workflow sube únicamente los artefactos de
#     la plataforma nueva con `gh release upload --clobber`, sin borrar ni pisar
#     los de los demás SO.
#
#   • **La app instalada** pregunta por
#     `releases/download/updater-stable/latest-{{target}}.json`
#     (`tauri.conf.json` → `plugins.updater`), donde `{{target}}` resuelve a
#     `darwin`, `windows` o `linux`. Cada archivo vive en la release fija
#     `updater-stable` (`--latest=false`) y apunta a los binarios inmutables en
#     `releases/download/v<versión>/`.
#
#   • **Promover o revertir un SO no recompila ni gasta firmas.** Se hace con
#     `.github/workflows/promote-update.yml`:
#
#         gh workflow run promote-update.yml -R danil-labs/danil -f version=0.3.5 -f platforms=macos
#
#     Eso verifica la firma minisign de `v0.3.5` y actualiza solo
#     `latest-darwin.json`, `Danil-macOS.dmg` y `Terminus-macOS.dmg` en
#     `updater-stable`, sin tocar Windows ni Linux.
#
#   • **Compatibilidad con copias anteriores (`v0.3.2`).** Cuando se construyen
#     las tres plataformas juntas (`platforms=all`), `release-manifest.mjs` emite
#     además `latest.json` combinado para permitir una release puente explícita
#     (`gh release edit v<versión> --prerelease=false --latest`). Una corrida
#     parcial (un solo SO) nunca emite un `latest.json` a medias.
#
#   • **danil.ai/download/** sirve `Danil-Windows-Setup.exe`, `Danil-macOS.dmg`
#     y `Danil-Linux-x86_64.AppImage` (ver `apps/desktop/docs/download-urls.md`).
#     Son **nombres estables sin versión dentro**: este workflow sube una copia
#     con ese nombre además del archivo versionado, y `promote-update.yml` copia
#     el de cada SO promovido a `updater-stable`. Las copias `Terminus-*` se
#     mantienen durante la transición para enlaces viejos.
#
#   • **Las notas por idioma.** Cada `latest-<target>.json` lleva `notes` (la
#     nota en inglés, o en español si la versión no trae inglés: es el campo
#     estándar del updater de Tauri) y, en la raíz, `notes_by_locale`:
#     `{ "es": …, "en": … }`. El cuerpo de la release de GitHub va bilingüe:
#     inglés y después español, separados por una regla `---`.
#
# ## Firmar no es opcional, y no es una sola firma
#
# La app comprueba lo que se baja contra la llave pública **que viaja dentro del
# binario ya instalado**. Una release sin firmar no se instala mal: no se instala,
# y la copia de quien la esperaba se queda donde está. Es minisign, y no tiene
# nada que ver con Authenticode ni con la notarización de Apple —esas quitan el
# aviso del sistema la primera vez, y cada una tiene su propio paso en
# `build`: eSigner (SSL.com) en Windows, Developer ID + notarytool en macOS. En
# Linux no hay firma del sistema: el AppImage lleva solo la de minisign.
#
name: publish

on:
  # A version tag stages all three platforms for that version. The tag must match `tauri.conf.json`.
  push:
    tags: ["v*"]

  # By hand, from a maintainer (staging per OS or all):
  #
  #     gh workflow run publish.yml -R danil-labs/danil --ref main -f platforms=macos
  #
  workflow_dispatch:
    inputs:
      platforms:
        description: "Plataformas a construir y subir a staging (v<versión>)"
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
          - linux
      rebuild:
        description: "Volver a construir las plataformas pedidas si aún no están promovidas en updater-stable"
        type: boolean
        default: false
      # Para probar un cambio a este archivo sin tocar lo publicado. Corre todo
      # —build, firmas, pruebas, manifiestos— y se detiene antes de crear o
      # actualizar la release: `publish` arma los manifiestos y los deja como
      # artefacto `dist-manifest`, pero no publica nada. Se lanza desde la rama
      # del PR:
      #
      #     gh workflow run publish.yml -R danil-labs/danil --ref <rama> -f platforms=macos -f dry_run=true
      #
      # **Un ensayo no firma Windows.** El plan de eSigner cobra cada firma, y un
      # ensayo gastaba las de una release para un instalador que nadie baja. Sin
      # sus secrets el paso de Windows no puede firmar aunque algo falle: Tauri
      # construye sin `signCommand` y se comprueba que lo instalado esté, no su
      # Authenticode. La firma de minisign, macOS y Linux siguen igual. Lo que
      # solo prueba eSigner se ve en la primera release real.
      dry_run:
        description: "Construir y comprobar sin publicar nada"
        type: boolean
        default: false

# Dos corridas a la vez se pisarían creando o subiendo al mismo tag. No se
# cancela la que esté en curso: a mitad de un build cancelar deja el tag a medias.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  # El runner de macOS (7 GB) se queda sin heap de Node al construir el front con
  # Mermaid 12 y Excalidraw; el límite por omisión es menor que la memoria.
  NODE_OPTIONS: --max-old-space-size=6144

  # ─── La identidad de la app, copiada aquí a propósito ───────────────────────
  #
  # Estas cuatro cosas **no se pueden cambiar publicando**. Un cambio en
  # cualquiera de ellas sale de un build que funciona, de un instalador que se
  # ejecuta y de una corrida en verde — y rompe algo que nadie va a ver hasta
  # semanas después:
  #
  #   • `PUBLIC_KEY` — la app instalada verifica lo que baja contra la llave
  #     que lleva **compilada dentro de su propio binario**. Una release firmada
  #     con otra llave no es «una actualización que falla»: esa copia queda
  #     varada en su versión para siempre, y desde dentro no hay vuelta. Rotar la
  #     llave son dos pasos y en este orden: primero una versión firmada con la
  #     llave VIEJA que ya lleve la NUEVA dentro, y solo después firmar con la
  #     nueva. Quien se salte esa versión puente reinstala a mano.
  #
  #   • `UPDATER_ENDPOINT` — la URL fija desde la que cada copia instalada busca
  #     su manifiesto `latest-{{target}}.json`. Cambiarla por accidente deja a
  #     esa versión mirando a otro lado.
  #
  #   • `IDENTIFIER` — es dónde viven los datos (sesiones, cuentas, consumo) y
  #     la llave del llavero. Cambiarlo no borra nada: deja los datos huérfanos y
  #     la app abre **vacía**, sin error y sin aviso.
  #
  #   • `PRODUCT_NAME` — es la clave del registro de desinstalación en Windows
  #     (`HKCU\…\Uninstall\<nombre>`) y la carpeta de instalación. Cambiarlo
  #     instala **al lado** de la copia vieja: dos entradas en Programas y
  #     características y dos apps en disco. Pasó de Terminus a Danil en la
  #     0.3.0: `windows/hooks.nsh` encuentra la copia «Terminus», instala en su
  #     carpeta y retira su entrada. Un cambio más exige otra migración igual.
  #
  # Duplicarlas aquí es el punto: son la memoria de lo que las copias instaladas
  # ya creen. Cambiarlas exige tocar este archivo, que es un PR que alguien lee —
  # en vez de un `tauri.conf.json` que se edita por otra razón.
  PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDM5ODEzRDE1M0QwQ0RFQjgKUldTNDNndzlGVDJCT1hPSnp4ZzBIbkowOW9kVGFYb0YyRkZKZjNTT2N3eERXOXhuRi9UblY5d3EK
  UPDATER_ENDPOINT: https://github.com/danil-labs/danil/releases/download/updater-stable/latest-{{target}}.json
  IDENTIFIER: ai.danil.terminus
  PRODUCT_NAME: Danil

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # ¿Hay algo que construir? Sale barato preguntarlo, y evita arrancar runners.
  # ─────────────────────────────────────────────────────────────────────────────
  check:
    if: github.repository == 'danil-labs/danil'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    outputs:
      should_build: ${{ steps.compare.outputs.should_build }}
      version: ${{ steps.compare.outputs.version }}
      sha: ${{ steps.compare.outputs.sha }}
      note_es: ${{ steps.compare.outputs.note_es }}
      note_en: ${{ steps.compare.outputs.note_en }}
      platforms: ${{ steps.compare.outputs.platforms }}
      matrix: ${{ steps.compare.outputs.matrix }}
    steps:
      - name: Traer la fuente
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Lo que este paso protege no lo protege ninguna otra cosa: el build, el
      # instalador y la corrida salen todos en verde con la identidad cambiada.
      # Falla aquí, antes de publicar, porque después de publicar ya no se puede
      # arreglar en las copias instaladas.
      - name: La identidad no cambió a espaldas de nadie
        run: |
          set -euo pipefail

          failed=0
          compare_value() {
            local what="$1" expected="$2" found="$3" consequence="$4"
            if [ "$expected" != "$found" ]; then
              echo "::error title=$what cambió::esperado '$expected', encontrado '$found'. $consequence"
              failed=1
            fi
          }

          compare_value "La llave pública del updater" \
            "$PUBLIC_KEY" \
            "$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json)" \
            "Publicar así deja varada en su versión, para siempre, a toda copia ya instalada. Se rota en dos pasos: primero una versión firmada con la llave vieja que lleve la nueva dentro."

          compare_value "El endpoint del updater" \
            "$UPDATER_ENDPOINT" \
            "$(jq -r '.plugins.updater.endpoints[0] // ""' src-tauri/tauri.conf.json)" \
            "Cambiar el endpoint rompe el canal updater-stable por SO para las copias nuevas."

          compare_value "El identificador del bundle" \
            "$IDENTIFIER" \
            "$(jq -r .identifier src-tauri/tauri.conf.json)" \
            "Los datos de quien ya la tiene quedan huérfanos y la app abre vacía, sin error. Hace falta una migración en migration.rs."

          compare_value "El nombre del producto" \
            "$PRODUCT_NAME" \
            "$(jq -r .productName src-tauri/tauri.conf.json)" \
            "La actualización instala al lado de la copia vieja: dos entradas en Programas y características. windows/hooks.nsh adopta solo la copia Terminus; otro nombre necesita su propia migración."

          compare_value "La llave pública que usa npx" \
            "$PUBLIC_KEY" \
            "$(sed -n "s/^ *'\(dW50cnVzdGVk[^']*\)';$/\1/p" npx/bin.mjs | head -1)" \
            "npx dejaría de poder instalar aunque la app se actualice bien."

          [ "$failed" = 0 ] || {
            echo ""
            echo "Si el cambio es deliberado, va en el mismo PR que actualiza estos valores"
            echo "en .github/workflows/publish.yml — y lee ahí lo que cuesta cada uno."
            exit 1
          }

          echo "Identidad intacta: misma llave, mismo endpoint, mismo identificador, mismo nombre."

      # La ventana no trae motor: lo arranca desde el `danil-engine` empaquetado.
      # Publicar sin él deja a toda copia instalada con una ventana que no abre,
      # y el updater la reparte sola. El ensayo también lo exige: es lo que prueba.
      # Que el archivo esté lo comprueba cada build, después de «Colocar el motor como sidecar».
      - name: El motor viaja dentro del instalador
        id: engine-pinned
        run: |
          set -euo pipefail
          missing=$(jq -r '.platforms | to_entries[] | select(.value.url == "" or .value.sha256 == "") | .key' seldon-runtime.lock)
          if [ -n "$missing" ]; then
            echo "::error title=Motor sin fijar::seldon-runtime.lock no fija: $(echo $missing). Una release sin motor deja la app instalada sin abrir."
            exit 1
          fi
          # La ventana deriva su contrato de commands.json y rechaza un motor que hable otro.
          vendored=$(sha256sum src-tauri/crates/engine-protocol/commands.json | cut -d' ' -f1)
          pinned=$(jq -r .contract seldon-runtime.lock)
          if [ "$vendored" != "$pinned" ]; then
            echo "::error title=Motor con otro contrato::seldon-runtime.lock fija el contrato $pinned y la ventana habla $vendored: la app instalada no abriría su motor."
            exit 1
          fi
          # Tauri suma a la base el archivo de cada plataforma; macOS no tiene archivo propio.
          for os in windows linux macos; do
            files=(src-tauri/tauri.conf.json)
            [ -f "src-tauri/tauri.$os.conf.json" ] && files+=("src-tauri/tauri.$os.conf.json")
            jq -es 'map(.bundle.externalBin // []) | add | (index("binaries/danil-engine") != null and index("binaries/seldon-runtime") != null)' "${files[@]}" >/dev/null \
              || { echo "::error title=Motor sin empaquetar::$os no declara danil-engine y su alias seldon-runtime en bundle.externalBin (${files[*]})."; exit 1; }
          done

      - name: Comparar con lo publicado
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS_INPUT: ${{ inputs.platforms || 'all' }}
          REBUILD: ${{ inputs.rebuild }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # La versión de la app la manda `tauri.conf.json`: es la que se compila
          # dentro del binario y la que el updater compara. `package.json` y
          # `Cargo.toml` la repiten y podrían desincronizarse, así que se
          # comprueba que las tres digan lo mismo antes de construir nada — una
          # release cuyo binario dice otra versión que su manifiesto deja a
          # todo el mundo en bucle de actualizar.
          V=$(jq -r .version src-tauri/tauri.conf.json)
          VP=$(jq -r .version package.json)
          VC=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ "$V" != "$VP" ] || [ "$V" != "$VC" ]; then
            echo "::error::Las versiones no coinciden — tauri.conf.json=$V package.json=$VP Cargo.toml=$VC"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión v$V de tauri.conf.json"
            exit 1
          fi

          REQUESTED=$(node scripts/release-manifest.mjs platforms --platforms "$PLATFORMS_INPUT")

          # La nota es lo que lee una persona en la página de la release y en el
          # aviso de la app. Se revisa en el mismo PR que sube la versión. Hay una por
          # idioma: `release-notes/es.md` y `release-notes/en.md`.
          NOTE_ES=""
          NOTE_EN=""
          [ ! -f release-notes/es.md ] || NOTE_ES=$(cat release-notes/es.md)
          [ ! -f release-notes/en.md ] || NOTE_EN=$(cat release-notes/en.md)
          [ -n "$NOTE_ES" ] || NOTE_ES="Mejoras y correcciones."

          # Las notas son texto libre de varias líneas: el delimitador es
          # aleatorio para que ninguna nota pueda cerrarlo por accidente.
          DELIMITER="NOTE_END_$(openssl rand -hex 8)"
          {
            echo "version=$V"
            echo "sha=$(git rev-parse HEAD)"
            echo "note_es<<$DELIMITER"
            printf '%s\n' "$NOTE_ES"
            echo "$DELIMITER"
            echo "note_en<<$DELIMITER"
            printf '%s\n' "$NOTE_EN"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          # Una release ya marcada como final no se reescribe; crea una versión nueva.
          if [ "${DRY_RUN:-false}" != "true" ] \
            && [ "$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease 2>/dev/null || true)" = "false" ]; then
            echo "::error::v$V ya está publicada como release final. Crea una versión nueva."
            exit 1
          fi

          # Ninguna plataforma promovida en `updater-stable` puede reemplazarse in-place:
          # cambiar sus bytes rompería la firma que ya leen las copias instaladas.
          if [ "${DRY_RUN:-false}" != "true" ]; then
            IFS=',' read -r -a req_arr <<< "$REQUESTED"
            for plat in "${req_arr[@]}"; do
              mf=$(node scripts/release-manifest.mjs manifest-files --platforms "$plat")
              promoted_v=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/updater-stable/$mf" 2>/dev/null | jq -r '.version // ""' || true)
              if [ "$promoted_v" = "$V" ]; then
                echo "::error::v$V ya está promovida en updater-stable para $plat ($mf). No se reemplazan artefactos en producción; sube a una versión nueva."
                exit 1
              fi
            done
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            TO_BUILD="$REQUESTED"
            echo "Ensayo de v$V ($TO_BUILD): se construye y se comprueba, no se publica."
          elif [ "${REBUILD:-false}" = "true" ]; then
            TO_BUILD="$REQUESTED"
            echo "Se pidió rehacer v$V para: $TO_BUILD."
          else
            existing_assets=$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
            missing=()
            IFS=',' read -r -a req_arr <<< "$REQUESTED"
            for plat in "${req_arr[@]}"; do
              mf=$(node scripts/release-manifest.mjs manifest-files --platforms "$plat")
              if printf '%s\n' "$existing_assets" | grep -qx "$mf"; then
                echo "v$V ya tiene $mf staged ($plat); se omite (usa rebuild=true para rehacerla si no está promovida)."
              else
                missing+=("$plat")
              fi
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              echo "v$V ya tiene todas las plataformas pedidas ($REQUESTED). No hay nada que construir."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "platforms=" >> "$GITHUB_OUTPUT"
              echo "matrix=[]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TO_BUILD=$(IFS=','; echo "${missing[*]}")
            echo "Construyendo v$V para: $TO_BUILD."
          fi

          MATRIX=$(node scripts/release-manifest.mjs matrix --platforms "$TO_BUILD")
          {
            echo "should_build=true"
            echo "platforms=$TO_BUILD"
            echo "matrix=$MATRIX"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────────
  # Un runner por plataforma pedida. Cross-compilar Windows desde macOS no
  # funciona —el target MSVC necesita el `link.exe` de Microsoft— así que no hay
  # atajo. Linux se construye en Ubuntu 22.04 y no en la última: un AppImage
  # lleva pegada la versión de glibc del runner donde se hizo, y solo corre en
  # sistemas con esa versión o una posterior.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}
    runs-on: ${{ matrix.so }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Traer la fuente
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.name }}

      # Lo que Tauri necesita para compilar en Linux (WebKitGTK, la bandeja del
      # sistema, `patchelf` para el AppImage) y lo que el AppImage necesita para
      # arrancar aquí mismo (`libfuse2`, y `xvfb` para tener pantalla).
      - name: Instalar las dependencias de build en Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config build-essential libssl-dev libfuse2 xvfb

      - run: pnpm install --frozen-lockfile

      # El motor fijado en `seldon-runtime.lock`, verificado por su SHA-256 y
      # copiado a `src-tauri/binaries/` para `bundle.externalBin`, que lo declara
      # para las tres plataformas.
      - name: Colocar el motor como sidecar
        shell: bash
        run: |
          set -euo pipefail
          pnpm engine:sidecar
          case "${{ matrix.name }}" in
            windows) triples=(x86_64-pc-windows-msvc.exe) ;;
            macos) triples=(aarch64-apple-darwin) ;;
            linux) triples=(x86_64-unknown-linux-gnu) ;;
          esac
          expected=()
          for t in "${triples[@]}"; do expected+=("danil-engine-$t" "seldon-runtime-$t"); done
          for f in "${expected[@]}"; do
            [ -f "src-tauri/binaries/$f" ] || { echo "::error title=Motor sin empaquetar::falta src-tauri/binaries/$f."; exit 1; }
          done

      - name: Preparar herramientas incluidas verificadas
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/work-tools-release.py prepare --directory "$RUNNER_TEMP/work-tools-release"

      # La notarización pide un `.p8` en disco, no el contenido en una variable.
      # Tauri busca `AuthKey_<APPLE_API_KEY>.p8` o `APPLE_API_KEY_PATH`. El
      # secret es el PEM entero; aquí se escribe y se borra con el runner.
      #
      # `signingIdentity: "-"` en `tauri.conf.json` se queda: es la firma ad-hoc
      # de los builds locales. `APPLE_SIGNING_IDENTITY` la pisa solo aquí.
      - name: Preparar la notarización de Apple
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            [ -n "${!v}" ] || { echo "::error title=Falta el secret $v::Sin él el .dmg sale ad-hoc y macOS avisa. Va en Settings → Secrets and variables → Actions de este repo."; exit 1; }
          done

          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          P8="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | tr -d '\r' > "$P8"
          [ -s "$P8" ] || { echo "::error::APPLE_API_KEY_P8 quedó vacío al escribirlo."; exit 1; }
          grep -q "BEGIN PRIVATE KEY" "$P8" \
            || { echo "::error::APPLE_API_KEY_P8 no parece un PEM: falta BEGIN PRIVATE KEY. Pega el .p8 entero, encabezado incluido."; exit 1; }
          # PEM con newline final: notarytool es más quisquilloso si el archivo
          # se corta a media línea.
          [ "$(tail -c1 "$P8" | wc -l)" -eq 1 ] || echo >> "$P8"
          echo "APPLE_API_KEY_PATH=$P8" >> "$GITHUB_ENV"

      # **Tauri reescribe `terminus.exe` al empaquetar.** `tauri bundle` busca en
      # el binario la marca `__TAURI_BUNDLE_TYPE_VAR_UNK` y la cambia por
      # `__TAURI_BUNDLE_TYPE_VAR_NSS` (`patch_binary` en
      # `tauri-bundler/src/bundle.rs`, CLI 2.11.4): así el updater de la app sabe
      # qué paquete le toca bajar. Firmar el `.exe` antes de ese paso, como se hizo
      # hasta v0.2.6, deja la firma sobre bytes que ya no existen: en la copia
      # instalada `Get-AuthenticodeSignature` da `HashMismatch`. Y el desinstalador
      # lo genera `makensis` dentro del paquete, así que nadie lo firmaba.
      #
      # Por eso firma Tauri, con `bundle.windows.signCommand`. Llama al comando
      # **después** de parchear el `.exe`, desde `!uninstfinalize` para el
      # desinstalador y sobre el instalador antes de escribir su `.sig` de minisign.
      # Se pasa con `--config` desde aquí para no tocar `tauri.conf.json`.
      #
      # Tauri también le pasa las DLL de plugins de NSIS. Esas no se firman: solo
      # existen en un temporal mientras corre el instalador y nunca quedan
      # instaladas. Cada firma cuenta en el plan de eSigner, de 20 al mes: **dos por
      # release**, el ejecutable y el instalador. El desinstalador no se firma:
      # makensis lo regenera en cada build y no se descarga, así que SmartScreen
      # no lo evalúa; firmarlo costaba una firma por release.
      #
      # **El motor viaja dentro.** `bundle.externalBin` declara `danil-engine` y su alias `seldon-runtime`, y
      # Tauri le pasa ese `.exe` a `signCommand` salvo que ya llegue firmado
      # (`signtool verify /pa`, `sign_binaries_if_needed`, tauri-bundler 2.9.4).
      # El lock fija el `.exe` de Windows ya firmado por Danil, así que el motor
      # cuesta una firma por versión del motor, no por release: la primera release
      # que lo empaqueta sin firma lo firma y deja la copia firmada en el artefacto
      # `seldon-runtime-windows-signed`, que se sube a la release del motor y se fija.
      #
      # **En un ensayo, cero.** Los secrets de eSigner llegan vacíos y no se
      # pasa `signCommand`; el `.sig` de minisign sí se escribe, porque `publish`
      # arma `latest.json` con él. En un push de tag `inputs.dry_run` es nulo y
      # `!inputs.dry_run` da verdadero: una release real recibe los secrets.
      - name: Construir y firmar en Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          ES_USERNAME: ${{ !inputs.dry_run && secrets.ES_USERNAME || '' }}
          ES_PASSWORD: ${{ !inputs.dry_run && secrets.ES_PASSWORD || '' }}
          ES_CREDENTIAL_ID: ${{ !inputs.dry_run && secrets.ES_CREDENTIAL_ID || '' }}
          ES_TOTP_SECRET: ${{ !inputs.dry_run && secrets.ES_TOTP_SECRET || '' }}
          CST_URL: https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2-windows.zip
          CST_SHA256: 4afc32e8b7f79bbe1de7e4e7049aaad4e0f754357613b9bbec0e3052f06fd36b
          SSLCOM_ROOT_URL: http://cert.ssl.com/SSLcom-TLS-Root-2022-RSA.cer
          SSLCOM_ROOT_SHA256: 8faf7d2e2cb4709bb8e0b33666bf75a5dd45b5de480f8ea8d4bfe6bebc17f2ed
        run: |
          set -euo pipefail

          T=$(cygpath -u "$RUNNER_TEMP")
          export T

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Ensayo: no se prepara eSigner ni se pasa signCommand. Windows sale sin Authenticode."
          else
            for v in ES_USERNAME ES_PASSWORD ES_CREDENTIAL_ID ES_TOTP_SECRET; do
              [ -n "${!v}" ] || { echo "::error title=Falta el secret $v::Sin él no se firma la release de Windows. Va en Settings → Secrets and variables → Actions de este repo."; exit 1; }
            done

            curl -fsSL -o "$T/cst.zip" "$CST_URL"
            echo "$CST_SHA256  $T/cst.zip" | sha256sum -c -
            pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$T/cst.zip")' -DestinationPath '$(cygpath -w "$T/cst")'"

            # JDK 11.0.2 (2019) bundled en CodeSignTool no incluye la raíz
            # "SSL.com TLS RSA Root CA 2022" que cs.ssl.com empezó a usar en
            # septiembre de 2026. Sin ella, el handshake TLS cae por PKIX.
            curl -fsSL -o "$T/sslcom-root.cer" "$SSLCOM_ROOT_URL"
            echo "$SSLCOM_ROOT_SHA256  $T/sslcom-root.cer" | sha256sum -c -
            "$T/cst/jdk-11.0.2/bin/keytool.exe" -import -noprompt -trustcacerts \
              -alias sslcomtlsroot2022 \
              -file "$(cygpath -w "$T/sslcom-root.cer")" \
              -keystore "$(cygpath -w "$T/cst/jdk-11.0.2/lib/security/cacerts")" \
              -storepass changeit
          fi

          # Lo llama Tauri, un archivo por vez, con la ruta de Windows como único
          # argumento. Hereda del paso los secrets de eSigner y `T`.
          cat > "$T/sign-authenticode.sh" <<'SIGN'
          set -euo pipefail
          original=$(cygpath -u "$1")
          name=$(basename "$original")

          # Tauri también pasa cada .exe y .dll de los recursos. Las herramientas
          # incluidas conservan su firma de origen: firmarlas aquí cambiaría bytes
          # ya inventariados y gastaría cientos de firmas.
          case "$original" in
            */work-tools-release/work-tools/*)
              exit 0 ;;
          esac
          case "$name" in
            NSISdl.dll|StartMenu.dll|System.dll|nsDialogs.dll|nsis_tauri_utils.dll)
              echo "Authenticode: $name no se firma (plugin de NSIS, no se instala)."
              exit 0 ;;
            *.exe) copy="$name" ;;
            *)
              # El desinstalador llega con el nombre temporal que le da makensis (`nst….tmp`).
              echo "Authenticode: el desinstalador ($name) no se firma."
              exit 0 ;;
          esac
          input_dir="$T/sign-input"
          output_dir="$T/sign-output"
          rm -rf "$input_dir" "$output_dir"
          mkdir -p "$input_dir" "$output_dir"
          cp "$original" "$input_dir/$copy"

          # Cada firma manda un código TOTP. Entre la del desinstalador y la del
          # instalador pasan pocos segundos, y si eSigner rechaza un código ya
          # usado, la segunda fallaría. Esperar a la siguiente ventana de 30 s
          # cuesta, como mucho, medio minuto.
          if [ -f "$T/last-signature" ]; then
            wait_seconds=$(( $(cat "$T/last-signature") + 31 - $(date +%s) ))
            [ "$wait_seconds" -le 0 ] || sleep "$wait_seconds"
          fi

          (
            cd "$T/cst"
            MSYS_NO_PATHCONV=1 ./jdk-11.0.2/bin/java.exe -jar jar/code_sign_tool-1.3.2.jar sign \
              -username="$ES_USERNAME" \
              -password="$ES_PASSWORD" \
              -credential_id="$ES_CREDENTIAL_ID" \
              -totp_secret="$ES_TOTP_SECRET" \
              -input_file_path="$(cygpath -w "$input_dir/$copy")" \
              -output_dir_path="$(cygpath -w "$output_dir")"
          )
          date +%s > "$T/last-signature"

          signed="$output_dir/$copy"
          [ -f "$signed" ] || { echo "CodeSignTool no dejó $name firmado; su salida está arriba." >&2; exit 1; }

          seen=$(FILE_W="$(cygpath -w "$signed")" pwsh -NoProfile -Command '$s = Get-AuthenticodeSignature -LiteralPath $env:FILE_W; "{0}|{1}|{2}" -f $s.Status, $s.SignerCertificate.Subject, [bool]$s.TimeStamperCertificate' | tr -d '\r')
          IFS='|' read -r status subject timestamp <<< "$seen"
          [ "$status" = "Valid" ] || { echo "Windows no da la firma de $name por válida: $status." >&2; exit 1; }
          case "$subject" in
            *"Software y Servicios Danil"*) ;;
            *) echo "Firmó un certificado que no es el de Danil: $subject" >&2; exit 1 ;;
          esac
          [ "$timestamp" = "True" ] || { echo "La firma de $name no lleva sello de tiempo." >&2; exit 1; }

          cp -f "$signed" "$original"
          echo "$copy|$seen" >> "$T/signed.txt"
          SIGN

          # Rutas absolutas y con `/`: el mismo comando lo ejecuta Tauri y, para
          # el desinstalador, makensis desde otra carpeta. `bash` con ruta
          # completa porque, sin ella, Windows puede encontrar antes el de WSL
          # en System32. En un ensayo el script existe pero nadie lo llama.
          SIGN_CONFIG=()
          if [ "${DRY_RUN:-false}" != "true" ]; then
            CONFIG=$(jq -nc \
              --arg bash "$(cygpath -m "$(command -v bash)")" \
              --arg sign_script "$(cygpath -m "$T/sign-authenticode.sh")" \
              '{bundle: {windows: {signCommand: {cmd: $bash, args: [$sign_script, "%1"]}}}}')
            echo "signCommand: $CONFIG"
            SIGN_CONFIG=(--config "$CONFIG")
          fi
          : > "$T/signed.txt"

          # El motor como sidecar: Tauri lo busca en `src-tauri/<entrada>-<triple>.exe`
          # y lo instala como `danil-engine.exe` y su alias `seldon-runtime.exe` (mismos bytes). Si ya llega firmado por Danil,
          # Tauri no lo pasa por eSigner y no cuenta como firma de esta corrida.
          ENGINE_SIDECAR=""
          ENGINE_ENTRY=$(jq -rs 'map(.bundle.externalBin // []) | add | map(select(test("seldon-runtime"))) | .[0] // ""' \
            src-tauri/tauri.conf.json src-tauri/tauri.windows.conf.json)
          if [ -n "$ENGINE_ENTRY" ]; then
            ENGINE_FILE="src-tauri/${ENGINE_ENTRY}-x86_64-pc-windows-msvc.exe"
            [ -f "$ENGINE_FILE" ] || { echo "::error title=Motor sin empaquetar::externalBin declara $ENGINE_ENTRY pero no está $ENGINE_FILE."; exit 1; }
            echo "ENGINE_PACKAGED=true" >> "$GITHUB_ENV"
            engine_signer=$(FILE_W="$(cygpath -w "$(realpath "$ENGINE_FILE")")" pwsh -NoProfile -Command '$s = Get-AuthenticodeSignature -LiteralPath $env:FILE_W; "{0}|{1}" -f $s.Status, $s.SignerCertificate.Subject' | tr -d '\r')
            case "$engine_signer" in
              "Valid|"*"Software y Servicios Danil"*) echo "seldon-runtime ya llega firmado por Danil: Tauri no lo vuelve a firmar." ;;
              *)
                ENGINE_SIDECAR=$(basename "$ENGINE_FILE")
                # En un ensayo no se firma: no hay copia firmada que guardar.
                [ "${DRY_RUN:-false}" = "true" ] || echo "ENGINE_SIGNED_HERE=true" >> "$GITHUB_ENV"
                echo "::warning title=Motor sin firma en el lock::seldon-runtime llega sin la firma de Danil ($engine_signer): lo firma eSigner (en un ensayo, no). Sube el artefacto seldon-runtime-windows-signed a la release del motor y fíjalo en seldon-runtime.lock para no volver a gastar esta firma." ;;
            esac
          fi

          pnpm desktop:build --bundles nsis --config "$WORK_TOOLS_CONFIG" "${SIGN_CONFIG[@]}"

          INSTALLER=$(find src-tauri/target/release/bundle -type f -name '*_x64-setup.exe' | head -1)
          [ -n "$INSTALLER" ] || { echo "::error::No se construyó ningún *_x64-setup.exe."; exit 1; }

          # Tauri ya escribe el `.sig` después de la firma Authenticode. Se
          # rehace de todos modos: sale gratis y no depende de ese orden interno.
          # `--app-version` liga la firma a la versión, como en macOS y Linux:
          # el updater 2.14 rechaza un `.sig` cuya versión no es la de `latest.json`.
          # `check` ya comprobó que el tag y `tauri.conf.json` coinciden.
          pnpm tauri signer sign --app-version "$(jq -r .version src-tauri/tauri.conf.json)" "$INSTALLER"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            {
              echo "### Authenticode — Windows"
              echo ""
              echo "Ensayo: firmas de eSigner en esta corrida: **0**. Se construyó sin signCommand; lo instalado no se exige firmado."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Lo que se firmó, y cuántas firmas de eSigner costó.
          echo "Firmado con eSigner:"
          sed 's/^/  /' "$T/signed.txt"
          failed=0
          expected_files=(terminus.exe "$(basename "$INSTALLER")")
          [ -z "$ENGINE_SIDECAR" ] || expected_files+=("$ENGINE_SIDECAR")
          for expected in "${expected_files[@]}"; do
            grep -q "^$expected|" "$T/signed.txt" \
              || { echo "::error::Tauri no pidió firmar $expected."; failed=1; }
          done
          [ "$failed" = 0 ]
          n=$(wc -l < "$T/signed.txt")
          [ "$n" -le "${#expected_files[@]}" ] || echo "::warning title=Más firmas de eSigner::Esta release gastó $n firmas, no ${#expected_files[@]}. Mira qué más pasó por signCommand."
          {
            echo "### Authenticode — Windows"
            echo ""
            echo "Firmas de eSigner en esta corrida: **$n**"
            echo ""
            cut -d'|' -f1,2 "$T/signed.txt" | sed 's/|/: /; s/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      # La firma que importa es la del archivo que queda en disco, no la del que
      # salió del build: v0.2.6 pasó todas las comprobaciones del build con un
      # `terminus.exe` que, instalado, daba `HashMismatch`. Aquí se instala en
      # silencio, como usuario, igual que lo hace una persona, y se mira lo que
      # quedó en `%LOCALAPPDATA%\<PRODUCT_NAME>`. En un ensayo no hubo Authenticode:
      # se exige que esté todo y la marca de NSIS, y la firma solo se muestra.
      - name: Comprobar las firmas de lo que se instala
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dryRun = $env:DRY_RUN -eq 'true'
          $installer = Get-ChildItem -Recurse -File src-tauri/target/release/bundle -Filter '*_x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'No se construyó ningún *_x64-setup.exe.' }

          $p = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El instalador salió con $($p.ExitCode)." }

          $dir = Join-Path $env:LOCALAPPDATA $env:PRODUCT_NAME
          $failed = $false
          $required = @('terminus.exe', 'uninstall.exe')
          if ($env:ENGINE_PACKAGED -eq 'true') { $required += 'danil-engine.exe', 'seldon-runtime.exe' }
          foreach ($expected in $required) {
            if (-not (Test-Path (Join-Path $dir $expected))) {
              Write-Output "::error::El instalador no dejó $expected en $dir."
              $failed = $true
            }
          }

          Get-ChildItem -Recurse -File $dir -Include *.exe, *.dll | ForEach-Object {
            $s = Get-AuthenticodeSignature -LiteralPath $_.FullName
            $rel = $_.FullName.Substring($dir.Length + 1)
            Write-Output ("{0}: {1} | {2} | sello: {3}" -f $rel, $s.Status, $s.SignerCertificate.Subject, [bool]$s.TimeStamperCertificate)
            # Las herramientas incluidas conservan la firma de origen: `signCommand`
            # las deja fuera a propósito (ver «Construir y firmar en Windows»).
            # Dentro de ForEach-Object, `return` pasa al siguiente archivo.
            if ($rel -like 'work-tools\*') { return }
            if ($dryRun) { return }
            if ($rel -eq 'uninstall.exe' -and $s.Status -eq 'NotSigned') {
              # Sin firmar a propósito: ver «Construir y firmar en Windows».
            } elseif ($s.Status -ne 'Valid') {
              Write-Output "::error title=Firma inválida en lo instalado::$rel quedó $($s.Status)."
              $failed = $true
            } elseif ($s.SignerCertificate.Subject -notlike '*Software y Servicios Danil*' -or -not $s.TimeStamperCertificate) {
              Write-Output "::error::$rel no lleva el certificado de Danil con sello de tiempo."
              $failed = $true
            }
          }

          # Y que lo firmado sea el `.exe` ya parcheado: sin la marca de NSIS, el
          # updater de la app no sabría qué paquete bajar.
          $bytes = [IO.File]::ReadAllBytes((Join-Path $dir 'terminus.exe'))
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains('__TAURI_BUNDLE_TYPE_VAR_NSS')) {
            Write-Output '::error::El terminus.exe instalado no lleva la marca __TAURI_BUNDLE_TYPE_VAR_NSS.'
            $failed = $true
          }

          if ($failed) { exit 1 }
          if ($dryRun) {
            Write-Output ("Ensayo: lo instalado está completo ({0}); su Authenticode no se exige." -f ($required -join ', '))
          } else {
            Write-Output ("Lo instalado: {0} presentes; los firmados, por Danil, válidos y con sello de tiempo." -f ($required -join ', '))
          }

          if ($env:ENGINE_SIGNED_HERE -eq 'true') {
            $out = Join-Path $env:RUNNER_TEMP 'engine-signed'
            New-Item -ItemType Directory -Force $out | Out-Null
            $signedEngine = Join-Path $out 'seldon-runtime-x86_64-pc-windows-msvc.exe'
            Copy-Item -LiteralPath (Join-Path $dir 'seldon-runtime.exe') -Destination $signedEngine
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $signedEngine).Hash.ToLowerInvariant()
            "ENGINE_SIGNED_DIR=$out" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            "### Motor firmado en esta corrida`n`nSHA-256 ``$hash``. Súbelo a la release del motor y fíjalo en ``seldon-runtime.lock``." | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }

      - name: Guardar el motor firmado
        if: runner.os == 'Windows' && env.ENGINE_SIGNED_HERE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seldon-runtime-windows-signed
          path: ${{ env.ENGINE_SIGNED_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Construir y firmar en macOS
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        run: |
          python3 scripts/work-tools-macos.py --directory "$RUNNER_TEMP/work-tools-release/work-tools"
          pnpm desktop:build --target aarch64-apple-darwin --config "$WORK_TOOLS_CONFIG"

      # `tauri.linux.conf.json` vive en el repo del código y ajusta el bundle a
      # AppImage. Firma con la llave de minisign, como en las otras dos.
      - name: Construir y firmar en Linux
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm desktop:build --config src-tauri/tauri.linux.conf.json --config "$WORK_TOOLS_CONFIG"

      - name: Verificar los recursos después del empaquetado
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            macOS)
              app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Danil.app
              resources="$app/Contents/Resources/work-tools"
              engine="$app/Contents/MacOS/danil-engine"
              ;;
            Windows)
              resources="$(cygpath -u "$LOCALAPPDATA")/$PRODUCT_NAME/work-tools"
              engine="$(cygpath -u "$LOCALAPPDATA")/$PRODUCT_NAME/danil-engine.exe"
              ;;
            Linux)
              image=$(find src-tauri/target/release/bundle -name '*.AppImage' -type f | head -1)
              image=$(realpath "$image")
              mkdir -p "$RUNNER_TEMP/work-tools-final"
              (cd "$RUNNER_TEMP/work-tools-final" && "$image" --appimage-extract >/dev/null)
              resources="$RUNNER_TEMP/work-tools-final/squashfs-root/usr/share/Danil/work-tools"
              engine="$RUNNER_TEMP/work-tools-final/squashfs-root/usr/bin/danil-engine"
              ;;
          esac
          python3 scripts/work-tools-release.py verify --directory "$resources"
          app_args=()
          [ "$RUNNER_OS" != macOS ] || app_args=(--app "$app")
          python3 scripts/work-tools-runtime-smoke.py --engine "$engine" --resources "$(dirname "$resources")" --browser --clone "${app_args[@]}"

      - name: Comprobar el bundle arm64
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Danil.app
          file -b "$APP/Contents/MacOS/terminus" | grep -q 'Mach-O 64-bit.*arm64'
          TOOLS="$APP/Contents/Resources/work-tools"
          while IFS= read -r f; do
            info=$(file -b "$f")
            echo "$info" | grep -q 'Mach-O' || continue
            echo "$info" | grep -q 'arm64' || { echo "::error::$f no incluye arquitectura arm64: $info"; exit 1; }
          done < <(find "$APP" -type f -not -path "$TOOLS/*")
          while IFS= read -r f; do
            info=$(file -b "$f")
            echo "$info" | grep -q 'Mach-O' || continue
            echo "$info" | grep -q 'arm64' || { echo "::error::$f no incluye arquitectura arm64: $info"; exit 1; }
          done < <(find "$TOOLS/aarch64-apple-darwin" -type f)

      # Con `CI=true` Tauri arma el `.dmg` sin acomodar la ventana (`--skip-jenkins`)
      # y le pone al disco el ícono de la app: la gente abría la app desde el
      # disco en vez de copiarlo. dmgbuild escribe la ventana sin Finder, con el
      # ícono de instalador. Se firma aquí porque el llavero de Tauri ya no existe.
      - name: Armar el .dmg con su ventana
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          B=src-tauri/target/aarch64-apple-darwin/release/bundle
          APP="$B/macos/Danil.app"
          DMG=$(find "$B" -type f -name '*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "::error::No se construyó el .dmg."; exit 1; }

          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet 'dmgbuild==1.6.7'
          rm "$DMG"
          "$RUNNER_TEMP/dmgbuild/bin/dmgbuild" -s src-tauri/macos/dmg-settings.py \
            -D "app=$APP" -D "assets=$PWD/src-tauri/macos" "Instalar Danil" "$DMG"

          KC="$RUNNER_TEMP/dmg-signing.keychain-db"
          KC_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 900 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/dmg-signing.p12"
          security import "$RUNNER_TEMP/dmg-signing.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/dmg-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          codesign --force --timestamp --keychain "$KC" --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          security delete-keychain "$KC"
          codesign --verify --verbose=2 "$DMG"

          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG" >/dev/null
          for f in .DS_Store .VolumeIcon.icns .background.tiff Danil.app Applications; do
            [ -e "$MNT/$f" ] || { hdiutil detach "$MNT" >/dev/null; echo "::error::Al .dmg le falta $f."; exit 1; }
          done
          hdiutil detach "$MNT" >/dev/null

      # El código de salida de `tauri build` tampoco basta: un .app ad-hoc o sin
      # ticket grapado llega a `release-assets/` igual. `stapler validate` es lo que
      # Gatekeeper mira en un Mac sin red; si falla, no se publica.
      # Tauri notariza y grapa el `.app`; el `.dmg` lo arma después, y sale sin
      # ticket propio. Lo que la gente descarga es el `.dmg`, así que se
      # notariza también: con su ticket grapado, Gatekeeper lo acepta en un Mac
      # sin red. Hay que someterlo aparte porque el ticket va por hash, y el del
      # `.dmg` no es el del `.app` que lleva dentro.
      - name: Notarizar y grapar el .dmg
        if: runner.os == 'macOS'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          DMG=$(find src-tauri/target/aarch64-apple-darwin/release/bundle -type f -name '*.dmg' | head -1)
          [ -n "$DMG" ] || { echo "::error::No se construyó el .dmg."; exit 1; }
          xcrun notarytool submit "$DMG"             --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER"             --wait
          xcrun stapler staple "$DMG"

      - name: Comprobar la firma de Apple
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          B=src-tauri/target/aarch64-apple-darwin/release/bundle
          APP=$(find "$B" -name 'Danil.app' -type d | head -1)
          DMG=$(find "$B" -type f -name '*.dmg' | head -1)
          [ -n "$APP" ] || { echo "::error::No se construyó Danil.app."; exit 1; }
          [ -n "$DMG" ] || { echo "::error::No se construyó el .dmg."; exit 1; }

          codesign --verify --deep --strict --verbose=2 "$APP"
          INFO=$(codesign -dv --verbose=4 "$APP" 2>&1)
          echo "$INFO"
          echo "$INFO" | grep -q "Developer ID Application: Software y Servicios Danil" \
            || { echo "::error::No está firmado con el Developer ID de Danil."; exit 1; }
          echo "$INFO" | grep -q "flags=.*runtime" \
            || { echo "::error::Falta hardened runtime: Apple rechaza la notarización."; exit 1; }

          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          echo "Apple: Developer ID de Danil, hardened runtime, ticket grapado en .app y .dmg."

      # Los nombres que produce Tauri llevan la versión y la arquitectura dentro,
      # y cambian solos al subir cualquiera de las dos. Aquí se normalizan a una
      # carpeta con nombres fijos: lo que el paso de publicar espera encontrar
      # deja de depender de cómo se llamó el archivo hoy.
      #
      # Y **se falla si algo no está**. Un `cp` que no encuentra su origen en un
      # `if` amable publica una release a la que le falta el `.sig`, que es
      # exactamente la release que nadie puede instalar.
      - name: Recoger los artefactos
        id: collect-artifacts
        shell: bash
        env:
          V: ${{ needs.check.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          B=src-tauri/target/release/bundle
          if [ "${{ matrix.name }}" = "macos" ]; then
            B=src-tauri/target/aarch64-apple-darwin/release/bundle
          fi

          require_file() {
            local pattern="$1" target="$2"
            local f
            f=$(find "$B" -type f -name "$pattern" | head -1)
            if [ -z "$f" ]; then
              echo "::error::No se construyó ningún $pattern. Contenido de $B:"
              find "$B" -type f | sed 's/^/    /'
              exit 1
            fi
            cp "$f" "release-assets/$target"
            echo "  $pattern → $target  ($(du -h "$f" | cut -f1))"
          }

          if [ "${{ matrix.name }}" = "windows" ]; then
            # NSIS y no MSI: es el formato que el updater sabe aplicar sin
            # intervención, y `installMode: passive` lo instala enseñando barra
            # de progreso pero sin preguntar nada.
            require_file '*_x64-setup.exe'     "Danil_${V}_x64-setup.exe"
            require_file '*_x64-setup.exe.sig' "Danil_${V}_x64-setup.exe.sig"
            cp "release-assets/Danil_${V}_x64-setup.exe" release-assets/Danil-Windows-Setup.exe
            cp "release-assets/Danil_${V}_x64-setup.exe" release-assets/Terminus-Windows-Setup.exe
          elif [ "${{ matrix.name }}" = "macos" ]; then
            require_file '*.app.tar.gz'     "Danil.app.tar.gz"
            require_file '*.app.tar.gz.sig' "Danil.app.tar.gz.sig"
            require_file '*_aarch64.dmg'    "Danil_${V}_aarch64.dmg"
            for name in Danil-macOS Terminus-macOS; do
              cp "release-assets/Danil_${V}_aarch64.dmg" "release-assets/$name.dmg"
            done
          else
            # El AppImage es lo que el updater baja y lo que la página enlaza:
            # una sola copia versionada, más el nombre estable.
            require_file '*.AppImage'     "Danil_${V}_amd64.AppImage"
            require_file '*.AppImage.sig' "Danil_${V}_amd64.AppImage.sig"
            cp "release-assets/Danil_${V}_amd64.AppImage" release-assets/Danil-Linux-x86_64.AppImage
            cp "release-assets/Danil_${V}_amd64.AppImage" release-assets/Terminus-Linux-x86_64.AppImage
          fi

          {
            echo "### Instaladores — ${{ matrix.name }}"
            echo ""
            echo "| archivo | tamaño |"
            echo "|---|---|"
            for f in release-assets/*; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.name }}
          if-no-files-found: error
          path: apps/desktop/release-assets/*

      - name: Dividir el instalador para revisión del ensayo
        if: inputs.dry_run
        shell: bash
        run: |
          node scripts/work-tools-qa-artifacts.mjs release-assets "$RUNNER_TEMP/qa-installer" "${{ matrix.name }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.dry_run
        with:
          name: qa-${{ matrix.name }}-installer-1
          path: ${{ runner.temp }}/qa-installer/*.part-01
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.dry_run
        with:
          name: qa-${{ matrix.name }}-installer-2
          path: ${{ runner.temp }}/qa-installer/*.part-02
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.dry_run
        with:
          name: qa-${{ matrix.name }}-installer-3
          path: ${{ runner.temp }}/qa-installer/*.part-03
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.dry_run
        with:
          name: qa-${{ matrix.name }}-installer-4
          path: ${{ runner.temp }}/qa-installer/*.part-04
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.dry_run
        with:
          name: qa-${{ matrix.name }}-installer-5
          path: ${{ runner.temp }}/qa-installer/*.part-05
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.dry_run
        with:
          name: qa-${{ matrix.name }}-installer-6
          path: ${{ runner.temp }}/qa-installer/*.part-06
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.dry_run
        with:
          name: qa-${{ matrix.name }}-installer-7
          path: ${{ runner.temp }}/qa-installer/*.part-07
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.dry_run
        with:
          name: qa-${{ matrix.name }}-installer-8
          path: ${{ runner.temp }}/qa-installer/*.part-08
          if-no-files-found: ignore
          compression-level: 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.dry_run
        with:
          name: qa-${{ matrix.name }}-installer-metadata
          path: ${{ runner.temp }}/qa-installer/*.json
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Pruebas en máquina limpia por plataforma construida y publicación en staging
  # (`v<versión>` como prerelease). Promover a `updater-stable` ocurre por SO en
  # `.github/workflows/promote-update.yml`.
  # ─────────────────────────────────────────────────────────────────────────────
  test-macos:
    needs: [check, build]
    if: ${{ always() && needs.check.result == 'success' && needs.build.result == 'success' && contains(format(',{0},', needs.check.outputs.platforms), ',macos,') }}
    strategy:
      matrix:
        so: [macos-latest]
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-macos
          path: release-assets
      - name: Ejecutar el bundle en macOS Apple Silicon
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          tar xzf release-assets/Danil.app.tar.gz
          file -b Danil.app/Contents/MacOS/terminus | grep -q 'Mach-O 64-bit.*arm64'
          codesign --verify --deep --strict Danil.app
          for engine in danil-engine seldon-runtime; do
            file -b "Danil.app/Contents/MacOS/$engine" | grep -q 'Mach-O 64-bit.*arm64'
            codesign -dv "Danil.app/Contents/MacOS/$engine" 2>&1 | grep -qx 'Identifier=seldon-runtime' \
              || { echo "::error title=Motor con otro identificador::$engine no está firmado como seldon-runtime."; exit 1; }
          done
          # Sin argumentos arrancaría el motor empaquetado. Con uno que no entiende
          # sale con `cli.error.invalid_request`: el ejecutable carga; la interfaz no se prueba.
          out=$(Danil.app/Contents/MacOS/terminus --external-host 2>&1) && { echo "::error::Arrancó con un argumento inválido"; exit 1; }
          echo "$out" | grep -q invalid_request
          python3 apps/desktop/scripts/work-tools-release.py verify --directory Danil.app/Contents/Resources/work-tools
          python3 apps/desktop/scripts/work-tools-runtime-smoke.py --engine Danil.app/Contents/MacOS/danil-engine --resources Danil.app/Contents/Resources --browser --clone --app Danil.app

  # El AppImage que se va a publicar, en un Ubuntu limpio: la firma minisign
  # con el mismo verificador que usa `npx`, que lleve el motor, y que el binario
  # cargue y responda (con un argumento que no entiende sale con `invalid_request`:
  # el ejecutable carga; la interfaz no se prueba).
  # `xvfb-run` da una pantalla virtual y `--appimage-extract-and-run` evita
  # depender de que FUSE funcione dentro del runner.
  test-linux:
    needs: [check, build]
    if: ${{ always() && needs.check.result == 'success' && needs.build.result == 'success' && contains(format(',{0},', needs.check.outputs.platforms), ',linux,') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Instalar las dependencias de ejecución del AppImage
        run: sudo apt-get update && sudo apt-get install -y libfuse2 xvfb libwebkit2gtk-4.1-0 libayatana-appindicator3-1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-linux
          path: release-assets
      - name: Verificar la firma del AppImage y arrancarlo
        env:
          V: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          APP="Danil_${V}_amd64.AppImage"
          export APP PUBLIC_KEY
          node --input-type=module <<'JS'
          import { verifyFile } from './apps/desktop/npx/lib/minisign.mjs';
          import { readFileSync } from 'node:fs';
          await verifyFile({
            filePath: `release-assets/${process.env.APP}`,
            sigFileB64: readFileSync(`release-assets/${process.env.APP}.sig`, 'utf8'),
            publicKeyB64: process.env.PUBLIC_KEY,
            expectedFileName: process.env.APP,
          });
          console.log('Firma minisign del AppImage verificada.');
          JS
          chmod +x "release-assets/$APP"
          for engine in danil-engine seldon-runtime; do
            (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/release-assets/$APP" --appimage-extract "usr/bin/$engine" >/dev/null)
            [ -x "$RUNNER_TEMP/squashfs-root/usr/bin/$engine" ] || { echo "::error title=Motor sin empaquetar::el AppImage no lleva usr/bin/$engine."; exit 1; }
          done
          out=$(timeout 60s xvfb-run -a "release-assets/$APP" --appimage-extract-and-run --external-host 2>&1) && { echo "::error::Arrancó con un argumento inválido"; exit 1; }
          echo "$out" | grep -q invalid_request

  publish:
    needs: [check, build, test-macos, test-linux]
    # Cuando se construye un solo SO, los tests de los otros SO salen `skipped`.
    # `!failure() && !cancelled()` garantiza que ningún fallo pase desapercibido.
    if: >-
      ${{ !failure() && !cancelled()
          && needs.check.result == 'success'
          && needs.check.outputs.should_build == 'true'
          && needs.build.result == 'success'
          && (needs.test-macos.result == 'success' || needs.test-macos.result == 'skipped')
          && (needs.test-linux.result == 'success' || needs.test-linux.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          pattern: dist-*
          merge-multiple: true

      # Verifica que cada `.sig` habla del nombre exacto del archivo que se
      # publica y genera `latest-<target>.json` para cada plataforma construida
      # (y `latest.json` combinado solo cuando se construyeron las tres).
      - name: Armar manifiestos por SO
        id: build-manifest
        env:
          V: ${{ needs.check.outputs.version }}
          PLATFORMS: ${{ needs.check.outputs.platforms }}
          NOTE_ES: ${{ needs.check.outputs.note_es }}
          NOTE_EN: ${{ needs.check.outputs.note_en }}
        run: |
          set -euo pipefail
          ls -la release-assets
          node apps/desktop/scripts/release-manifest.mjs build \
            --assets-dir release-assets \
            --version "$V" \
            --repo "$GITHUB_REPOSITORY" \
            --platforms "$PLATFORMS"
          for f in release-assets/latest*.json; do
            echo "=== $f ==="
            cat "$f"
          done

      # En un ensayo no hay release donde mirarlo: los manifiestos se quedan
      # como artefacto para revisión.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.dry_run
        with:
          name: dist-manifest
          path: release-assets/latest*.json
          if-no-files-found: error

      # Sube los artefactos a la prerelease `v<versión>`. Si la prerelease ya
      # existe (por otro SO), sube solo los archivos de esta corrida con
      # `upload --clobber` sin borrar ni tocar los demás SO.
      - name: Publicar en staging (prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
          PLATFORMS: ${{ needs.check.outputs.platforms }}
          NOTE_ES: ${{ needs.check.outputs.note_es }}
          NOTE_EN: ${{ needs.check.outputs.note_en }}
          SHA: ${{ needs.check.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          [ -n "$NOTE_EN" ] || NOTE_EN="Improvements and fixes."

          # shellcheck disable=SC2016  # Los backticks son Markdown literal.
          BODY=$(
            printf '%s\n\n' "$NOTE_EN"
            printf 'Windows: `Danil-Windows-Setup.exe` · macOS Apple Silicon: `Danil-macOS.dmg` · Linux x86_64: `Danil-Linux-x86_64.AppImage`\n\n'
            printf 'If you already have it installed there is nothing to download: the app notifies you on its own.\n\n'
            printf 'Built from `%s` in run `%s`.\n\n---\n\n' "$SHA" "$GITHUB_RUN_ID"
            printf '%s\n\n' "$NOTE_ES"
            printf 'Windows: `Danil-Windows-Setup.exe` · macOS Apple Silicon: `Danil-macOS.dmg` · Linux x86_64: `Danil-Linux-x86_64.AppImage`\n\n'
            printf 'Quien ya la tenga instalada no necesita bajar nada: la app avisa sola.\n\n'
            printf 'Construida desde `%s` en `%s`.\n' "$SHA" "$GITHUB_RUN_ID"
          )

          ASSETS=(release-assets/*)
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "Ensayo ($PLATFORMS): no se crea ni modifica v$V."
            echo "Archivos listos: ${ASSETS[*]}"
            printf '### Staging (dry-run)\n\nPlataformas: `%s` · Versión: `v%s`\n' "$PLATFORMS" "$V" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$V ya existe en staging; subiendo artefactos de $PLATFORMS sin tocar otros SO."
            gh release upload "v$V" --repo "$GITHUB_REPOSITORY" --clobber "${ASSETS[@]}"
            printf '### Staging actualizado\n\n`gh release upload v%s --clobber` (%s)\n' "$V" "$PLATFORMS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Creando prerelease v$V para $PLATFORMS."
            gh release create "v$V" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SHA" \
              --title "v$V" \
              --notes "$BODY" \
              --prerelease \
              --latest=false \
              "${ASSETS[@]}"
            printf '### Staging creado\n\n`gh release create v%s --target %s --prerelease --latest=false` (%s)\n' "$V" "$SHA" "$PLATFORMS" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Comprobar desde fuera lo subido a `v<versión>` y que `releases/latest`
      # sigue intacto (nadie recibe la actualización hasta correr `promote-update.yml`).
      - name: Comprobar el staging en v<versión>
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.version }}
          PLATFORMS: ${{ needs.check.outputs.platforms }}
        run: |
          set -euo pipefail
          [ "$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)" = "true" ] \
            || { echo "::error::v$V no quedó como prerelease"; exit 1; }
          [ "$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isLatest -q .isLatest)" = "false" ] \
            || { echo "::error::v$V quedó marcada como Latest"; exit 1; }

          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$V"
          TMP=$(mktemp -d)
          IFS=',' read -r -a built_arr <<< "$PLATFORMS"
          for plat in "${built_arr[@]}"; do
            mf=$(node apps/desktop/scripts/release-manifest.mjs manifest-files --platforms "$plat")
            curl -fsSL "$BASE/$mf" -o "$TMP/$mf"
            node apps/desktop/scripts/release-manifest.mjs verify \
              --manifest "$TMP/$mf" \
              --platform "$plat" \
              --version "$V" \
              --repo "$GITHUB_REPOSITORY"
            while IFS= read -r stable; do
              curl -fsSIL -o /dev/null "$BASE/$stable" \
                || { echo "::error::$stable no responde en v$V"; exit 1; }
            done < <(node apps/desktop/scripts/release-manifest.mjs stable-files --platforms "$plat")
          done
          rm -rf "$TMP"

          echo "v$V lista en staging para: $PLATFORMS. Promueve por SO con promote-update.yml."
