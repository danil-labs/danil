<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The window's policy (index.html) without the Tauri schemes. connect-src
         gets the control plane and Supabase at build time in vite.config.ts,
         which also writes this policy plus frame-ancestors 'none' to
         dist-web/_headers (it covers the phone under /m/ too).
         media-src adds blob: over the window: a video or audio file of the task
         arrives in parts (tree_read_part) and plays from a blob: URL the page
         itself made; Safari does not play video from data:. A blob: never
         leaves the browser. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; script-src-elem 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' data: blob:; connect-src 'self' %TERMINUS_WEB_CONNECT%; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Danil</title>
    <!-- Rutas absolutas desde web-public/: Vite les antepone la base de la web. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f9f9f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <!-- Antes del primer pintado, igual que lib/theme.ts. No toca las variables de la app. -->
    <script>
      try {
        var root = document.documentElement;
        var look = localStorage.getItem("harness:apariencia");
        var dark = look === "oscuro" || (look !== "claro" && matchMedia("(prefers-color-scheme: dark)").matches);
        root.dataset.theme = dark ? "dark" : "light";
        if (localStorage.getItem("harness:dark-style") !== "navy") root.dataset.darkStyle = "graphite";
        if (localStorage.getItem("harness:light-style") === "graphite") root.dataset.lightStyle = "graphite";
      } catch (e) {}
    </script>
    <!-- El marco del primer pintado. Sus variables son suyas: la hoja de la app no las hereda ni al revés. -->
    <style>
      html, body, #root { height: 100%; margin: 0; overflow: hidden; }
      html { background-color: #f9f9f9; }
      [data-theme="dark"] { background-color: #070b1c; }
      [data-theme="dark"][data-dark-style="graphite"] { background-color: #111113; }
      [data-theme="light"][data-light-style="graphite"] { background-color: #f4f4f5; }
      [data-marco-de-carga] { height: 100%; }
      .marco {
        --marco-bg: #f9f9f9;
        --marco-surface: #ffffff;
        --marco-raised: #ffffff;
        --marco-muted: #f3f4f8;
        --marco-ink: #0a0d23;
        --marco-on-ink: #fafbfd;
        --marco-frame: #e2e4ee;
        --marco-faint: #62647a;
        --marco-line: rgb(10 13 35 / 0.16);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--marco-frame);
        color: var(--marco-ink);
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      [data-theme="dark"] .marco {
        --marco-bg: #070b1c;
        --marco-surface: #1a2240;
        --marco-raised: #242e54;
        --marco-muted: #101630;
        --marco-ink: #e9ecf8;
        --marco-on-ink: #070b1c;
        --marco-frame: #070b1c;
        --marco-faint: #8d96bc;
        --marco-line: rgb(255 255 255 / 0.16);
        background: var(--marco-bg);
      }
      [data-theme="dark"][data-dark-style="graphite"] .marco {
        --marco-bg: #111113;
        --marco-surface: #212124;
        --marco-raised: #2c2c30;
        --marco-muted: #19191c;
        --marco-ink: #ececef;
        --marco-on-ink: #111113;
        --marco-frame: #111113;
        --marco-faint: #9a9aa3;
        --marco-line: rgb(255 255 255 / 0.14);
        background: var(--marco-bg);
      }
      [data-theme="light"][data-light-style="graphite"] .marco {
        --marco-bg: #f4f4f5;
        --marco-surface: #ffffff;
        --marco-raised: #ffffff;
        --marco-muted: #ececee;
        --marco-ink: #0a0a0b;
        --marco-on-ink: #fafafa;
        --marco-frame: #e0e0e4;
        --marco-faint: #5f5f68;
        --marco-line: rgb(9 9 11 / 0.15);
      }
      .marco-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
      .marco-bar {
        display: flex;
        align-items: stretch;
        height: 30px;
        flex: none;
        padding-left: 8px;
      }
      .marco-bar-side {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 300px;
        flex: none;
        padding-right: 8px;
      }
      .marco-space {
        width: 112px;
        height: 30px;
        flex: none;
        border-radius: 4px;
      }
      .marco-tabs {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        min-width: 0;
        flex: 1;
        margin-left: -6px;
        padding-left: 6px;
      }
      .marco-tab {
        position: relative;
        display: flex;
        align-items: center;
        width: 220px;
        height: 30px;
        flex: none;
        padding: 0 8px 0 8px;
        border-radius: 6px 6px 0 0;
        background: var(--marco-surface);
      }
      .marco-tab::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 100%;
        width: 6px;
        height: 6px;
        background: var(--marco-surface);
        -webkit-mask: radial-gradient(circle at 100% 0, transparent 6px, #000 6.5px);
        mask: radial-gradient(circle at 100% 0, transparent 6px, #000 6.5px);
      }
      .marco-plus {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        flex: none;
        margin-left: 2px;
        color: var(--marco-faint);
        font-size: 16px;
      }
      .marco-body { display: flex; min-height: 0; flex: 1; }
      .marco-rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: 48px;
        flex: none;
        padding: 8px 0;
      }
      .marco-mark { width: 32px; height: 32px; border-radius: 6px; }
      .marco-add {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        margin-top: 4px;
        border: 1px dashed var(--marco-faint);
        border-radius: 6px;
        color: var(--marco-faint);
        font-size: 16px;
      }
      .marco-rule { width: 24px; height: 1px; margin: 4px 0; background: var(--marco-line); }
      .marco-surface {
        display: flex;
        min-width: 0;
        flex: 1;
        margin: 0 4px 4px 0;
        overflow: hidden;
        border-radius: 10px;
        background: var(--marco-surface);
      }
      .marco-side {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 260px;
        flex: none;
        padding: 8px 8px 0;
        background: var(--marco-muted);
      }
      .marco-new {
        display: grid;
        grid-template-columns: 22px minmax(0, 1fr) auto;
        align-items: center;
        gap: 2px;
        height: 30px;
        min-height: 30px;
        padding: 0 8px;
        border-radius: 4px;
        background: var(--marco-ink);
        color: var(--marco-on-ink);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.25;
      }
      .marco-new svg { justify-self: center; }
      .marco-new kbd {
        padding: 0 4px;
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
        border-radius: 4px;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        font-weight: 400;
      }
      .marco-rows { display: flex; flex-direction: column; gap: 2px; }
      .marco-folder {
        display: flex;
        align-items: center;
        height: 34px;
        margin-bottom: 4px;
        padding-left: 22px;
      }
      .marco-task {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        box-sizing: border-box;
        height: 52px;
        padding: 7px 8px 7px 10px;
        border-radius: 10px;
      }
      .marco-main { display: flex; flex-direction: column; min-width: 0; flex: 1; }
      .marco-askwrap {
        box-sizing: border-box;
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
        padding: 12px 16px;
      }
      .marco-sources {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 4px 4px;
        color: var(--marco-faint);
        font-size: 11px;
      }
      .marco-composer {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 2px 4px 6px;
        border: 1px solid var(--marco-line);
        border-radius: 8px;
        background: var(--marco-raised);
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.12), 0 2px 4px -2px rgb(0 0 0 / 0.12);
      }
      .marco-field {
        box-sizing: border-box;
        min-height: 40px;
        margin: 0;
        padding: 6px 8px;
        color: var(--marco-faint);
        font-size: 13px;
        line-height: 1.4;
      }
      .marco-tools {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 32px;
        padding: 0 8px;
      }
      .marco-clip {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        flex: none;
        color: var(--marco-faint);
      }
      .marco-pill {
        width: 196px;
        height: 32px;
        flex: none;
        margin-left: auto;
        border-radius: 999px;
        background: var(--marco-muted);
      }
      .marco-send {
        width: 32px;
        height: 32px;
        flex: none;
        border-radius: 50%;
        background: var(--marco-ink);
      }
      .marco-icon {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        color: var(--marco-faint);
      }
      .marco-rail .marco-icon { width: 32px; height: 32px; }
      .marco-grow { flex: 1; }
      .marco-bone {
        display: block;
        height: 10px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--marco-faint) 28%, var(--marco-surface));
        animation: marco-breath 1.5s ease-in-out infinite;
      }
      .marco-space.marco-bone { height: 30px; }
      .marco-mark.marco-bone { height: 32px; }
      .marco-task .marco-bone + .marco-bone { height: 8px; animation-delay: 160ms; }
      .marco-rows .marco-task:nth-child(3) .marco-bone { animation-delay: 120ms; }
      .marco-rows .marco-task:nth-child(4) .marco-bone { animation-delay: 240ms; }
      .marco-rows .marco-task:nth-child(5) .marco-bone { animation-delay: 360ms; }
      @keyframes marco-breath { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) { .marco-bone { animation: none; } }
      @media (max-width: 680px) {
        .marco-bar-side { width: 46%; }
        .marco-side { width: 42%; }
      }
    </style>
  </head>
  <body>
    <!-- Una sola copia del marco. El script la pone en #root; un reintento de la puerta la clona otra vez. -->
    <template id="marco-de-carga">
      <div class="marco" data-marco-de-carga aria-busy="true">
        <p class="marco-sr" data-marco="status" aria-label="Cargando"></p>
        <div class="marco-bar">
          <div class="marco-bar-side">
            <span class="marco-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></span>
            <span class="marco-space marco-bone"></span>
            <span class="marco-grow"></span>
            <span class="marco-icon" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg></span>
            <span class="marco-icon" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h6V4H4zM14 20h6v-8h-6z"/><path d="M14 8V4h6"/></svg></span>
            <span class="marco-icon" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>
          </div>
          <div class="marco-tabs">
            <span class="marco-tab"><span class="marco-bone" style="width:62%"></span></span>
            <span class="marco-plus" aria-hidden="true">+</span>
          </div>
        </div>
        <div class="marco-body">
          <div class="marco-rail">
            <span class="marco-mark marco-bone"></span>
            <span class="marco-add" aria-hidden="true">+</span>
            <span class="marco-grow"></span>
            <span class="marco-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 8h8v8H8z"/><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></span>
            <span class="marco-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 7v4a3 3 0 0 0 3 3h0a3 3 0 0 0 3-3V7"/><path d="M12 17v3M8 21h8"/></svg></span>
            <span class="marco-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg></span>
            <span class="marco-rule"></span>
            <span class="marco-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg></span>
            <span class="marco-icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 3.8-4 7-4s5.5 1 7 4"/></svg></span>
          </div>
          <div class="marco-surface">
            <div class="marco-side">
              <div class="marco-new">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                <span data-marco="new">Nueva tarea</span>
                <kbd data-marco="keys">Ctrl+T</kbd>
              </div>
              <div class="marco-rows">
                <div class="marco-folder"><span class="marco-bone" style="width:46%"></span></div>
                <div class="marco-task"><span class="marco-bone" style="width:78%"></span><span class="marco-bone" style="width:42%"></span></div>
                <div class="marco-task"><span class="marco-bone" style="width:64%"></span><span class="marco-bone" style="width:36%"></span></div>
                <div class="marco-task"><span class="marco-bone" style="width:86%"></span><span class="marco-bone" style="width:48%"></span></div>
                <div class="marco-task"><span class="marco-bone" style="width:54%"></span><span class="marco-bone" style="width:30%"></span></div>
              </div>
            </div>
            <div class="marco-main">
              <span class="marco-grow"></span>
              <div class="marco-askwrap">
                <div class="marco-sources"><span data-marco="sources">Fuentes:</span><span aria-hidden="true">+</span></div>
                <div class="marco-composer">
                  <p class="marco-field" data-marco="ask">Pregunta algo</p>
                  <div class="marco-tools">
                    <span class="marco-clip" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5L10.5 17.5a2 2 0 0 1-3-3L15 7"/></svg></span>
                    <span class="marco-pill"></span>
                    <span class="marco-send" aria-hidden="true"></span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>
    <div id="root"></div>
    <script>
      (function () {
        var skip = false;
        try {
          var path = location.pathname.replace(/\/+$/, "");
          skip = /\/(connect|auth|sign-in|admin)$/.test(path) || /\/m(\/|$)/.test(location.pathname);
          if (!skip && new URLSearchParams(location.search).get("demo") === "1") skip = true;
          var layout = localStorage.getItem("terminus.web.layout");
          if (layout === "mobile") skip = true;
          else if (layout !== "desktop" && matchMedia("(pointer: coarse) and (max-width: 820px)").matches) skip = true;
        } catch (e) {}
        if (skip) return;
        var tpl = document.getElementById("marco-de-carga");
        if (!tpl || !tpl.content) return;
        var es = true;
        try {
          var pref = localStorage.getItem("harness:lengua") || "sistema";
          var code = localStorage.getItem("harness:lengua:ultima") || (pref === "sistema" ? navigator.language : pref) || "es";
          es = String(code).toLowerCase().split("-")[0] === "es";
        } catch (e) {}
        var text = {
          status: es ? "Cargando" : "Loading",
          "new": es ? "Nueva tarea" : "New task",
          ask: es ? "Pregunta algo" : "Ask something",
          sources: es ? "Fuentes:" : "Sources:",
          keys: /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? "⌘T" : "Ctrl+T"
        };
        tpl.content.querySelectorAll("[data-marco]").forEach(function (node) {
          var key = node.getAttribute("data-marco");
          if (!text[key]) return;
          if (key === "status") node.setAttribute("aria-label", text[key]);
          else node.textContent = text[key];
        });
        // Sin sesión en este navegador no se pinta: si no la hay, la página se va
        // al inicio de sesión y el marco de la app no debe aparecer ahí. En alfa la
        // sesión vive en una cookie; `start` pinta el marco cuando ya comprobó que hay.
        function pintarMarco() {
          var host = document.getElementById("root");
          if (!host || host.querySelector("[data-marco-de-carga]")) return;
          host.append(tpl.content.cloneNode(true));
        }
        window.pintarMarcoDeCarga = pintarMarco;
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i) || "";
            if ((key.indexOf("-auth-token") !== -1 || key.indexOf("terminus-auth:") === 0) && localStorage.getItem(key)) {
              pintarMarco();
              break;
            }
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/web/bootstrap.ts"></script>
  </body>
</html>
