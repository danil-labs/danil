name = "terminus-entry-alfa"
main = "worker.mjs"
account_id = "e1f9a060a59fa8a648440321571892de"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

# Todo el dominio: la web vive en la raíz y `/terminus/*` redirige a ella.
[[routes]]
pattern = "alfa-app.danil.ai/*"
zone_id = "e14ef2690bfae6ea80d2b8fffbcfd708"

[[services]]
binding = "TERMINUS_WEB"
service = "terminus-web-alfa"

# Conserva el namespace instalado; el Worker de compatibilidad lo consume remoto.
[[durable_objects.bindings]]
name = "DESKTOP_CODES"
class_name = "DesktopCodeStore"

[[migrations]]
tag = "v1-desktop-codes"
new_sqlite_classes = ["DesktopCodeStore"]
