# Entrada de staging: sesión y datos de plataforma por el borde configurado en el build.
name = "terminus-entry-staging"
main = "worker.mjs"
account_id = "e1f9a060a59fa8a648440321571892de"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "staging-app.danil.ai"
custom_domain = true

[vars]
ENTRY_HOST = "staging-app.danil.ai"

[[services]]
binding = "DESKTOP_AUTH"
service = "danil-legacy-desktop-auth-staging"

[[durable_objects.bindings]]
name = "DESKTOP_CODES"
class_name = "DesktopCodeStore"

[[migrations]]
tag = "v1-desktop-codes"
new_sqlite_classes = ["DesktopCodeStore"]
